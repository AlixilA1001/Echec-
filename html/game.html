<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME - Chess System v1.0</title>

  <base href="../">
  <link rel="stylesheet" href="css/chessboard-1.0.0.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/finPartie.css">
</head>

<body>

  <!-- Menu haut -->
  <div class="topnav">
    <a href="/Accueil">Accueil</a>
    <a href="/Analyse">Analyse</a>
    <a href="/Partie">Jouer en ligne</a>
    <a href="/Ordi">Contre un Bot</a>
  </div>

  <div class="main-container">
    <!-- Chat -->
    <div class="left-panel">
      <h3>Conversation</h3>
      <div id="chatBox">
        <div id="chatMessages"></div>
        <form id="chatForm">
          <input id="msg" autocomplete="off" placeholder="Écris ton message..." />
          <button type="submit" id="boutonEnvoyer">Envoyer</button>
        </form>
      </div>

      <div class="info-room">
        <p><span id="roomId" style="font-weight:bold;"></span></p>
      </div>
    </div>

    <!-- Échiquier -->
    <div class="center-panel">
      <div class="player-info" id="tableau1">
        <div class="pseudo">
          Joueur Noir
          <span class="timer"><span id="blackminutes">10</span>:<span id="blackseconds">00</span></span>
        </div>
      </div>

      <div id="cadreEchiquier">
        <div class="gameBoard" id="myBoard"></div>
      </div>

      <div class="player-info" id="tableau2">
        <div class="pseudo">
          Joueur Blanc
          <span class="timer"><span id="minutes">10</span>:<span id="seconds">00</span></span>
        </div>
      </div>

      <div class="controls">
        <button class="controls-button" id="flip">Inverser la vue</button>
        <button class="controls-button" id="abandonner">Abandonner la partie</button>
      </div>

      <div id="fin-partie" class="fin-message" style="display: none;">
        La partie est terminée !
      </div>
    </div>

    <!-- Pièces perdues -->
    <div class="right-panel">
      <h3>Pièces perdues</h3>

      <div class="captured">
        <p>Joueur Noir :</p>
        <div class="pieces">
          <img src="img/chesspieces/wikipedia/bP.png"> x<span id="bP">0</span>
          <img src="img/chesspieces/wikipedia/bN.png"> x<span id="bN">0</span>
          <img src="img/chesspieces/wikipedia/bB.png"> x<span id="bB">0</span>
          <img src="img/chesspieces/wikipedia/bR.png"> x<span id="bR">0</span>
          <img src="img/chesspieces/wikipedia/bQ.png"> x<span id="bQ">0</span>
        </div>

        <p>Joueur Blanc :</p>
        <div class="pieces">
          <img src="img/chesspieces/wikipedia/wP.png"> x<span id="wP">0</span>
          <img src="img/chesspieces/wikipedia/wN.png"> x<span id="wN">0</span>
          <img src="img/chesspieces/wikipedia/wB.png"> x<span id="wB">0</span>
          <img src="img/chesspieces/wikipedia/wR.png"> x<span id="wR">0</span>
          <img src="img/chesspieces/wikipedia/wQ.png"> x<span id="wQ">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="../jqueryy.js"></script>
  <script src="../chess.js"></script>
  <script src="../chessboard.js"></script>
  <script src="../socket.js"></script>
  <script src="../game.js"></script>

  <script>
    const roomId = window.location.pathname.split("/").pop();
    document.getElementById("roomId").textContent = roomId;
  </script>

</body>
</html>
