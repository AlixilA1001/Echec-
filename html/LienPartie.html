<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une Partie - Chess System</title>

  <link rel="stylesheet" href="../css/lienPartie.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <!-- Menu haut -->
  <div class="topnav">
    <a href="/Accueil">Accueil</a>
    <a href="/Analyse">Analyse</a>
    <a href="/Ordi">Jouer contre un Bot</a>
  </div>

  <!-- Conteneur principal -->
  <div class="container">
    <h1>Créer une Partie d'Échecs</h1>
    <button id="createBtn">Créer une nouvelle partie</button>
    <div id="linkContainer"></div>
  </div>

  <script>
    document.getElementById('createBtn').addEventListener('click', async () => {
      const response = await fetch('/createRoom');
      const data = await response.json();
      const roomId = data.roomId;
      const link = `${window.location.origin}/Room/${roomId}`;
      document.getElementById('linkContainer').innerHTML = `
        <p>Donne ce lien à ton ami :</p>
        <a href="${link}">${link}</a>
      `;
    });
  </script>

</body>
</html>
