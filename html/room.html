

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Socket.io Example</title>
    <script src="/socket.io/socket.io.js"></script>

  </head>
  <body>
    <p>
      En Attente d'adversaire...
    </p>
    <div id="roomInfo"></div>
    <script>
      const socket = io();
  // Écouter la réponse du serveur a 'redirectClients'
  socket.on('redirectClients', (url) => {
    // Effectuer la redirection vers la page de jeu
    window.location.href=url;
  });

// Vérifier si le nombre de clients atteint le maximum par salle
if (clientCount === 2){
  // Émettre un événement personnalisé au serveur avec l'ID de la salle la plus ancienne
  socket.emit('redirectToGame', oldestRoomId);
}
    </script>
  </body>
</html>
