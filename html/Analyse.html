<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse - Chess System v1.0</title>

  <base href="../">
  <link rel="stylesheet" href="css/chessboard-1.0.0.css">
  <link rel="stylesheet" href="css/analyse.css">
</head>

<body>

  <!-- Menu haut -->
  <div class="topnav">
    <a href="/Accueil">Accueil</a>
    <a href="/Partie">Jouer en ligne</a>
    <a href="/Ordi">Jouer contre un Bot</a>
  </div>

  <!-- Conteneur principal -->
  <div class="main-container">

    <!-- Bloc PGN -->
    <div class="left-panel">
      <h3>Charger un PGN</h3>
      <textarea id="pgnText" rows="8" placeholder="Collez ici votre PGN..."></textarea>
      <button id="loadPgnBtn">Charger le PGN</button>

      <div class="status-info">
        <p><strong>Status :</strong> <span id="status">Partie en attente</span></p>
        <p><strong>PGN :</strong></p>
        <p id="pgn">Aucun</p>
      </div>
    </div>

    <!-- Bloc Échiquier -->
    <div class="center-panel">
      <div id="myBoard"></div>
    
      <div class="controls">
        <button class="controls-button" id="prev">Précédent</button>
        <button class="controls-button" id="next">Suivant</button>
        <button class="controls-button" id="flip">Inverser la vue</button>
        <button class="controls-button" id="restart">Rejouer la Partie</button>
      </div>
    </div>

    <!-- Bloc Pièces perdues -->
    <div class="right-panel">
      <h3>Pièces perdues</h3>

      <div class="captured">
        <p>Joueur Noir :</p>
        <div class="pieces">
          <img src="img/chesspieces/wikipedia/bP.png"> x<span id="bP">0</span>
          <img src="img/chesspieces/wikipedia/bN.png"> x<span id="bN">0</span>
          <img src="img/chesspieces/wikipedia/bB.png"> x<span id="bB">0</span>
          <img src="img/chesspieces/wikipedia/bR.png"> x<span id="bR">0</span>
          <img src="img/chesspieces/wikipedia/bQ.png"> x<span id="bQ">0</span>
        </div>

        <p>Joueur Blanc :</p>
        <div class="pieces">
          <img src="img/chesspieces/wikipedia/wP.png"> x<span id="wP">0</span>
          <img src="img/chesspieces/wikipedia/wN.png"> x<span id="wN">0</span>
          <img src="img/chesspieces/wikipedia/wB.png"> x<span id="wB">0</span>
          <img src="img/chesspieces/wikipedia/wR.png"> x<span id="wR">0</span>
          <img src="img/chesspieces/wikipedia/wQ.png"> x<span id="wQ">0</span>
        </div>
      </div>
    </div>

  </div>

  <script src="jqueryy.js"></script>
  <script src="chess.js"></script>
  <script src="chessboard.js"></script>
  <script src="analyse.js"></script>

</body>
</html>
